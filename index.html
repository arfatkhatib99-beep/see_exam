<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="post" style="max-width: 420px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; font-family: Arial, sans-serif;">
        <h2 style="margin-top: 0;">Contact Form</h2>

        <label for="name" style="display: block; margin-bottom: 6px; font-weight: bold;">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">

        <label for="email" style="display: block; margin-bottom: 6px; font-weight: bold;">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">

        <label for="message" style="display: block; margin-bottom: 6px; font-weight: bold;">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; resize: vertical; box-sizing: border-box;"></textarea>

        <button type="submit" style="padding: 10px 18px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer;">Send</button>
    </form>
</body>
</html>
